<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="Демонстрационный кабинет сотрудников, отделов и отпусков"
    />
    <title>Sigma People</title>
    <script>
      try {
        const saved = localStorage.getItem('sigma-theme')
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script
      type="module"
      src="/src/app/main.ts"
    ></script>
  </body>
</html>
